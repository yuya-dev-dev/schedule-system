name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test backup script safeguards
        shell: pwsh
        run: ./scripts/tests/BackupScripts.Tests.ps1

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Playwright Chromium
        run: >-
          ./mvnw --batch-mode
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
          exec:java

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Build Docker image
        run: docker build --tag schedule-system:ci .

      - name: Test backup and isolated restore
        shell: pwsh
        run: ./scripts/tests/BackupRestoreSmoke.Tests.ps1
